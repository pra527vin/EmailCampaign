name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    # A real Postgres so `prisma migrate deploy` is exercised against a clean
    # database on every PR -- migration drift or a broken migration file is
    # the kind of thing that should fail here, not on the next deploy.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mailstrive
          POSTGRES_PASSWORD: mailstrive
          POSTGRES_DB: mailstrive_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mailstrive -d mailstrive_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mailstrive:mailstrive@localhost:5432/mailstrive_ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
